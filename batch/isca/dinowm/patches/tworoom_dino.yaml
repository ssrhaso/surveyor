# Deployed as dino_wm/conf/env/tworoom_dino.yaml: TwoRoom on frozen DINOv2
# features (the encoder-swap recovery leg). No gym registration needed for
# world-model training; the eval wrapper comes later if the recovery goes
# closed-loop.
name: tworoom_dino
args: []
kwargs: {}

dataset:
  _target_: "datasets.tworoom_dino_dset.load_tworoom_dino_slice_train_val"
  n_rollout: 4000
  normalize_action: ${normalize_action}
  data_path: /lustre/home/ha676/data/tworoom/tworoom.h5
  split_ratio: 0.95
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 8
